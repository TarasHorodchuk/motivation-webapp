<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>Адмін-панель 👨‍🏫</h1>

    <div class="card">
      <h2>Почати урок</h2>
      <select id="class-select">
        <option value="">Обери клас</option>
        <option value="7.1">7.1</option>
        <option value="7.2">7.2</option>
        <!-- Додай свої класи -->
      </select>
      <select id="subject-select">
        <option value="">Обери предмет</option>
        <option value="Алгебра">Алгебра</option>
        <option value="Геометрія">Геометрія</option>
      </select>
      <button class="btn" onclick="startLesson()">Почати урок</button>
    </div>

    <div class="card" id="lesson-section" style="display:none;">
      <h2>Оцінювання уроку</h2>
      <div id="lesson-content">Завантажуємо...</div>
    </div>

    <div class="card">
      <h2>Критерії</h2>
      <div id="criteria-list">Завантажуємо...</div>
      <input type="text" id="new-crit-name" placeholder="Назва критерію">
      <input type="number" id="new-crit-weight" placeholder="Вага (монет)" step="0.5">
      <button class="btn" onclick="addCriterion()">Додати критерій</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    function startLesson() {
      tg.showAlert("Урок почато (поки тест)");
      // Пізніше тут запит до API
    }

    function addCriterion() {
      tg.showAlert("Критерій додано (поки тест)");
      // Пізніше тут запит до API
    }

    tg.MainButton.setText("Оновити").show();
    tg.MainButton.onClick(() => {
      tg.showAlert("Оновлення адмін-панелі (поки тест)");
    });
  </script>
</body>
</html>
