<script>
  async function loadAdminData() {
    const data = await apiRequest('/admin/start_lesson', { class_name: "7.1", subject_name: "Алгебра" });
    if (data.success) {
      document.getElementById("lesson-section").style.display = "block";
      document.getElementById("lesson-content").innerHTML = data.success;
    }

    // Додаємо функцію для додавання критерію
    document.getElementById("addCriterion").addEventListener("click", () => {
      const name = document.getElementById("new-crit-name").value;
      const weight = document.getElementById("new-crit-weight").value;
      apiRequest('/api/admin/add_criterion', { name, weight })
        .then(data => tg.showAlert(data.success || data.error));
    });
  }

  tg.MainButton.setText("Оновити").show();
  tg.MainButton.onClick(loadAdminData);
  loadAdminData();
</script>
