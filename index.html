<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мотивація Математика</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e3a8a;
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 { font-size: 2.5em; }
    p { font-size: 1.5em; }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>Web App працює! 🎉</h1>
  <p>Привіт від Grok!</p>
  <p id="user-info">Завантаження даних...</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const user = tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("user-info").innerText =
        `Привіт, ${user.first_name || 'користувач'}! Твій ID: ${user.id}`;
    } else {
      document.getElementById("user-info").innerText = "Не вдалося отримати дані користувача";
    }

    tg.MainButton.setText("Закрити").show();
    tg.MainButton.onClick(() => tg.close());
  </script>
</body>
</html>
