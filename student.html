<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій профіль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div id="loading" class="loading">Завантаження профілю...</div>
    <div id="profile" style="display:none;">
      <h1 id="greeting">Привіт!</h1>
      <p id="class-info"></p>
      <div class="balance" id="total-balance">0 🪙</div>

      <div class="card">
        <h2>Баланс по предметах</h2>
        <div id="subjects-balance"></div>
      </div>

      <div class="card">
        <h2>Календар нарахувань</h2>
        <div id="calendar"></div>
      </div>

      <div class="card">
        <h2>Магазин бонусів</h2>
        <button class="btn" onclick="buyBonus(1)">+1 бал до оцінки (10 монет)</button>
        <button class="btn" onclick="buyBonus(2)">+2 бали до оцінки (20 монет)</button>
        <button class="btn" onclick="buyRemoveWarning()">Зняти зауваження (8 монет)</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    // ТВІЙ NGROK URL (оновлюй після кожного перезапуску ngrok)
    const BOT_API_URL = "https://alease-budless-castiel.ngrok-free.dev";

    async function apiRequest(endpoint) {
      try {
        const response = await fetch(`${BOT_API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        return await response.json();
      } catch (err) {
        console.error(err);
        return { error: "Помилка з'єднання" };
      }
    }

    async function loadProfile() {
      const data = await apiRequest('/api/student/profile');

      if (data.error) {
        document.getElementById("loading").innerText = "Помилка: " + data.error;
        return;
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("profile").style.display = "block";

      document.getElementById("greeting").innerText = `Привіт, ${data.first_name} ${data.last_name}!`;
      document.getElementById("class-info").innerText = `Клас: ${data.class_name}`;
      document.getElementById("total-balance").innerText = `${data.total_coins} 🪙`;

      const subjectsDiv = document.getElementById("subjects-balance");
      subjectsDiv.innerHTML = data.subjects.map(s => `
        <p><strong>${s.name}:</strong> ${s.coins} 🪙</p>
      `).join('');

      const calendarDiv = document.getElementById("calendar");
      if (data.calendar.length === 0) {
        calendarDiv.innerHTML = "<p>Уроків ще не було</p>";
      } else {
        calendarDiv.innerHTML = "<h3>Останні уроки:</h3>" + data.calendar.map(day => `
          <p><strong>${day.date}</strong>: ${day.subject} (+${day.total} 🪙)</p>
        `).join('');
      }
    }

    function buyBonus(bonus) {
      tg.showAlert(`Куплено +${bonus} бал(и) (поки тест)`);
    }

    function buyRemoveWarning() {
      tg.showAlert("Зауваження знято (поки тест)");
    }

    tg.MainButton.setText("Оновити").show();
    tg.MainButton.onClick(loadProfile);

    loadProfile();
  </script>
</body>
</html>
