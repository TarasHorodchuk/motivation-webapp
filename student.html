<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій профіль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1 id="greeting">Завантаження...</h1>
    <p id="class-info"></p>
    <div class="balance" id="total-balance">0 🪙</div>

    <div class="card">
      <h2>Баланс по предметах</h2>
      <div id="subjects-balance">Завантажуємо...</div>
    </div>

    <div class="card">
      <h2>Календар нарахувань</h2>
      <div id="calendar-container">Завантажуємо календар...</div>
    </div>

    <div class="card">
      <h2>Деталі за день</h2>
      <div id="day-details">Обери дату в календарі</div>
    </div>

    <div class="card">
      <h2>Магазин бонусів</h2>
      <button class="btn" onclick="buyBonus(1)">+1 бал до оцінки (10 монет)</button>
      <button class="btn" onclick="buyBonus(2)">+2 бали до оцінки (20 монет)</button>
      <button class="btn" onclick="buyRemoveWarning()">Зняти зауваження (8 монет)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const BOT_API_URL = "https://alease-budless-castiel.ngrok-free.dev";  // ← твій ngrok URL

    async function apiRequest(endpoint) {
      try {
        const response = await fetch(`${BOT_API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        return await response.json();
      } catch (err) {
        console.error("API помилка:", err);
        return { error: "Помилка з'єднання" };
      }
    }

    async function loadProfile() {
      const data = await apiRequest('/api/student/profile');

      if (data.error) {
        document.getElementById("calendar-container").innerHTML = `<p style="color:red;">Помилка: ${data.error}</p>`;
        return;
      }

      document.getElementById("greeting").innerText = `Привіт, ${data.first_name} ${data.last_name}!`;
      document.getElementById("class-info").innerText = `Клас: ${data.class_name}`;
      document.getElementById("total-balance").innerText = `${data.total_coins} 🪙`;

      const subjectsDiv = document.getElementById("subjects-balance");
      subjectsDiv.innerHTML = data.subjects.map(s => `
        <p><strong>${s.name}:</strong> ${s.coins} 🪙</p>
      `).join('');

      renderCalendar(data.calendar);  // Оновлений виклик
    }

    function renderCalendar(calendarData) {
      const container = document.getElementById("calendar-container");
      container.innerHTML = "";

      const today = new Date();
      const monthsUa = ["січень", "лютий", "березень", "квітень", "травень", "червень", "липень", "серпня", "вересня", "жовтень", "листопад", "грудень"];
      const months = [
        { year: today.getFullYear(), month: today.getMonth() },
        { year: today.getMonth() === 0 ? today.getFullYear() - 1 : today.getFullYear(), month: today.getMonth() === 0 ? 11 : today.getMonth() - 1 }
      ];

      months.forEach((m, index) => {
        const div = document.createElement("div");
        div.className = "month-card";

        const title = document.createElement("h3");
        title.textContent = `${monthsUa[m.month]} ${m.year}`;
        title.onclick = () => div.classList.toggle("collapsed");
        title.style.cursor = "pointer";
        div.appendChild(title);

        const table = document.createElement("table");
        table.className = "calendar-table";

        const header = table.insertRow();
        ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"].forEach(d => {
          const th = header.insertCell();
          th.textContent = d;
          th.className = "calendar-header";
        });

        const firstDay = new Date(m.year, m.month, 1).getDay();
        const daysInMonth = new Date(m.year, m.month + 1, 0).getDate();

        let row = table.insertRow();

        for (let i = 1; i < (firstDay === 0 ? 7 : firstDay); i++) {
          row.insertCell().className = "calendar-day empty";
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const cell = row.insertCell();
          cell.className = "calendar-day";
          const dayStr = new Date(m.year, m.month, day).toISOString().slice(0, 10);
          if (calendarData.some(c => c.date === dayStr)) {
            cell.className += " lesson";
            cell.onclick = () => showDayDetail(dayStr, calendarData);
          } else {
            cell.className += " other";
          }

          cell.textContent = day;

          if ((firstDay === 0 ? 7 : firstDay) + day - 1 % 7 === 0 && day < daysInMonth) {
            row = table.insertRow();
          }
        }

        div.appendChild(table);
        container.appendChild(div);
      });
    }

    function showDayDetail(dayStr, calendarData) {
      const dayData = calendarData.filter(c => c.date === dayStr);
      let text = `<strong>${dayStr}</strong><br><br>`;
      let total = 0;
      dayData.forEach(d => {
        text += `✓ ${d.action} (+${d.amount} монет)<br>`;
        total += d.amount;
      });
      text += `<br>Сумарно: ${total} 🪙`;

      document.getElementById("day-details").innerHTML = text;
    }

    tg.MainButton.setText("Оновити").show();
    tg.MainButton.onClick(loadProfile);

    loadProfile();
  </script>
</body>
</html>
