<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій профіль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1 id="greeting">Завантаження...</h1>
    <p id="class-info"></p>
    <div class="balance" id="total-balance">0 🪙</div>

    <div class="card">
      <h2>Баланс по предметах</h2>
      <div id="subjects-balance">Завантажуємо...</div>
    </div>

    <div class="card">
      <h2>Календар нарахувань</h2>
      <div id="calendar-container">Завантажуємо календар...</div>
    </div>

    <div class="card">
      <h2>Деталі за день</h2>
      <div id="day-details">Обери дату в календарі</div>
    </div>

    <div class="card">
      <h2>Магазин бонусів</h2>
      <button class="btn" onclick="buyBonus(1)">+1 бал до оцінки (10 монет)</button>
      <button class="btn" onclick="buyBonus(2)">+2 бали до оцінки (20 монет)</button>
      <button class="btn" onclick="buyRemoveWarning()">Зняти зауваження (8 монет)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const BOT_API_URL = "https://alease-budless-castiel.ngrok-free.dev";  // ← оновлюй свій ngrok URL

    async function apiRequest(endpoint) {
      try {
        const response = await fetch(`${BOT_API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        return await response.json();
      } catch (err) {
        console.error("API помилка:", err);
        tg.showAlert("Помилка з'єднання з ботом");
        return { error: "Помилка з'єднання" };
      }
    }

    async function loadProfile() {
      const data = await apiRequest('/api/student/profile');

      if (data.error) {
        document.getElementById("calendar-container").innerHTML = `<p style="color:red;">Помилка: ${data.error}</p>`;
        return;
      }

      document.getElementById("greeting").innerText = `Привіт, ${data.first_name} ${data.last_name}!`;
      document.getElementById("class-info").innerText = `Клас: ${data.class_name}`;
      document.getElementById("total-balance").innerText = `${data.total_coins} 🪙`;

      const subjectsDiv = document.getElementById("subjects-balance");
      subjectsDiv.innerHTML = data.subjects.map(s => `
        <p><strong>${s.name}:</strong> ${s.coins} 🪙</p>
      `).join('');

      renderCalendar(data.lesson_dates, data.daily_details);
    }

    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    function renderCalendar(lessonDates, dailyDetails) {
  const container = document.getElementById("calendar-container");
  container.innerHTML = "";

  const today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth(); // 0-11

  // Обмеження: тільки поточний і попередній місяць
  const maxYear = today.getFullYear();
  const maxMonth = today.getMonth();

  let prevMonth = maxMonth - 1;
  let prevYear = maxYear;
  if (prevMonth < 0) {
    prevMonth = 11;
    prevYear--;
  }
  const minYear = prevYear;
  const minMonth = prevMonth;

  const monthsUa = ["січень", "лютий", "березень", "квітень", "травень", "червень",
                    "липень", "серпня", "вересня", "жовтень", "листопад", "грудня"];

  // Навігація
  const navDiv = document.createElement("div");
  navDiv.style.display = "flex";
  navDiv.style.justifyContent = "space-between";
  navDiv.style.alignItems = "center";
  navDiv.style.marginBottom = "15px";

  const prevButton = document.createElement("button");
  prevButton.textContent = "←";
  prevButton.style.fontSize = "1.5em";
  prevButton.style.padding = "10px 15px";
  prevButton.style.opacity = "0.5"; // спочатку неактивна, бо стартуємо з поточного

  const nextButton = document.createElement("button");
  nextButton.textContent = "→";
  nextButton.style.fontSize = "1.5em";
  nextButton.style.padding = "10px 15px";
  nextButton.style.opacity = "0.5";
  nextButton.style.cursor = "not-allowed";

  const title = document.createElement("h3");
  title.textContent = `${monthsUa[currentMonth]} ${currentYear}`;
  title.style.margin = "0";
  title.style.textTransform = "capitalize";

  navDiv.appendChild(prevButton);
  navDiv.appendChild(title);
  navDiv.appendChild(nextButton);
  container.appendChild(navDiv);

  const monthCard = document.createElement("div");
  monthCard.style.opacity = "0";
  monthCard.style.transition = "opacity 0.3s ease";
  container.appendChild(monthCard);

  function updateButtons() {
    // ← активна тільки якщо не в попередньому місяці
    if (currentYear > minYear || currentMonth > minMonth) {
      prevButton.style.opacity = "1";
      prevButton.style.cursor = "pointer";
      prevButton.disabled = false;
    } else {
      prevButton.style.opacity = "0.5";
      prevButton.style.cursor = "not-allowed";
      prevButton.disabled = true;
    }

    // → активна тільки якщо не в поточному місяці
    if (currentYear < maxYear || currentMonth < maxMonth) {
      nextButton.style.opacity = "1";
      nextButton.style.cursor = "pointer";
      nextButton.disabled = false;
    } else {
      nextButton.style.opacity = "0.5";
      nextButton.style.cursor = "not-allowed";
      nextButton.disabled = true;
    }
  }

  function drawMonth(year, month) {
    title.textContent = `${monthsUa[month]} ${year}`;

    monthCard.style.opacity = "0";
    monthCard.innerHTML = "";

    const headerDiv = document.createElement("div");
    headerDiv.className = "calendar-header";
    ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"].forEach(d => {
      const span = document.createElement("span");
      span.textContent = d;
      headerDiv.appendChild(span);
    });
    monthCard.appendChild(headerDiv);

    const grid = document.createElement("div");
    grid.className = "calendar-grid";

    const firstDay = new Date(year, month, 1).getDay();
    const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < adjustedFirstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "calendar-day empty";
      grid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "calendar-day";

      const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      if (lessonDates.includes(dayStr)) {
        dayDiv.className += " lesson";
        dayDiv.onclick = () => showDayDetail(dayStr, dailyDetails[dayStr]);
      } else {
        dayDiv.className += " other";
      }

      dayDiv.textContent = day;
      grid.appendChild(dayDiv);
    }

    monthCard.appendChild(grid);

    setTimeout(() => {
      monthCard.style.opacity = "1";
    }, 50);

    updateButtons();
  }

  // Обробники кнопок
  prevButton.onclick = () => {
    if (prevButton.disabled) return;

    currentMonth--;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    drawMonth(currentYear, currentMonth);
  };

  nextButton.onclick = () => {
    if (nextButton.disabled) return;

    currentMonth++;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    drawMonth(currentYear, currentMonth);
  };

  // Початкове малювання
  drawMonth(currentYear, currentMonth);
}
    function showDayDetail(dayStr, details) {
      if (!details || details.total === 0) {
        document.getElementById("day-details").innerHTML = "За цю дату немає нарахувань.";
        return;
      }

      let text = `<strong>${dayStr}</strong><br><br>`;
      text += `Сумарно: ${details.total} 🪙<br><br>`;
      for (let crit of details.criteria) {
        text += `✓ ${crit.criterion} (+${crit.coins} монет)<br>`;
      }

      document.getElementById("day-details").innerHTML = text;
    }

    // Заглушки для магазину (поки що)
    function buyBonus(bonus) {
      tg.showAlert(`Куплено +${bonus} бал(и) до оцінки (функція в розробці)`);
    }

    function buyRemoveWarning() {
      tg.showAlert("Зауваження знято (функція в розробці)");
    }

    tg.MainButton.setText("Оновити").show();
    tg.MainButton.onClick(loadProfile);

    loadProfile();
  </script>
</body>
</html>
