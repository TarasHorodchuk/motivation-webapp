<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .avatar-bg {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin: 0 auto 25px;
            padding: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }
        .avatar {
            width: 134px;
            height: 134px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
        }
        .avatar-default {
            background: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: white;
            font-weight: bold;
        }
        .change-avatar-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .name {
            font-size: 34px;
            font-weight: bold;
            color: white;
            margin: 10px 0 5px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        .role {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }
        .coins {
            font-size: 24px;
            color: white;
            font-weight: bold;
            background: rgba(255,255,255,0.25);
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .menu {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .menu-item {
            padding: 24px 30px;
            font-size: 20px;
            color: #555;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .menu-item:hover:not(.active) {
            background: #f8f9fa;
            padding-left: 35px;
        }
        .content-section {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            margin-bottom: 30px;
        }
        .content-section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .content-section h2 {
            margin-top: 0;
            color: #764ba2;
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Календар */
        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .day-header {
            text-align: center;
            font-weight: bold;
            color: #764ba2;
            padding: 10px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .day:hover { background: #e9ecef; }
        .day.has-lesson {
            background: #d4edda;
            border: 3px solid #28a745;
        }
        .day.today {
            border: 3px solid #ff512f;
        }
        .day-number {
            font-size: 18px;
            font-weight: bold;
        }
        .day-coins {
            font-size: 14px;
            color: #28a745;
            margin-top: 4px;
        }

        /* Магазин */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .shop-item {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .shop-item:hover { transform: translateY(-5px); }
        .shop-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .shop-item-name {
            font-weight: bold;
            margin: 10px 0 5px;
        }
        .shop-item-price {
            color: #ff512f;
            font-weight: bold;
            font-size: 18px;
        }
        .buy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .buy-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #purchase-message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar-bg">
                <div class="avatar-wrapper">
                    <img id="avatar" class="avatar" src="" alt="Avatar">
                    <div class="change-avatar-btn" onclick="changeAvatar()">+</div>
                </div>
            </div>
            <div class="name" id="user-name">Завантаження...</div>
            <div class="role">Учень</div>
            <div class="coins" id="user-coins">Монети: 0</div>
        </div>

        <div class="menu">
            <div class="menu-item active" data-section="calendar">Календар</div>
            <div class="menu-item" data-section="shop">Магазин</div>
            <div class="menu-item" data-section="profile">Профіль</div>
        </div>

        <!-- Календар -->
        <div id="calendar-section" class="content-section active">
            <h2>Календар уроків</h2>
            <div id="calendar"></div>
            <div id="lesson-details" style="margin-top: 30px; text-align: center; font-size: 18px;"></div>
        </div>

        <!-- Магазин -->
        <div id="shop-section" class="content-section">
            <h2>Магазин бонусів</h2>
            <div class="shop-grid" id="shop-items"></div>
            <div id="purchase-message"></div>
        </div>

        <!-- Профіль -->
        <div id="profile-section" class="content-section">
            <h2>Мій профіль</h2>
            <p style="text-align: center; font-size: 18px;">Тут буде додаткова інформація: статистика, досягнення, рівень англійської тощо.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userData = {};
        let lessonsData = [];
        let shopItems = [];

        // Завантаження даних користувача
        async function loadUserData() {
            const response = await fetch('/get_user_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            userData = await response.json();

            document.getElementById('user-name').textContent = userData.name || 'Учень';
            document.getElementById('user-coins').textContent = `Монети: ${userData.coins || 0}`;

            const avatarImg = document.getElementById('avatar');
            if (userData.avatar_url) {
                avatarImg.src = userData.avatar_url + '?t=' + Date.now();
            } else {
                avatarImg.classList.add('avatar-default');
                avatarImg.textContent = (userData.name || '?')[0].toUpperCase();
            }

            await loadLessons();
            await loadShop();
            renderCalendar();
            renderShop();
        }

        // Зміна аватарки
        function changeAvatar() {
            tg.showPopup({
                title: 'Змінити аватарку',
                message: 'Надішліть нове фото',
                buttons: [{ type: 'default', text: 'OK' }]
            });

            tg.requestFile({
                types: ['photo'],
                callback: async (file) => {
                    const response = await fetch('/upload_avatar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initData: tg.initData, file_id: file.file_id })
                    });
                    const result = await response.json();
                    if (result.success) {
                        const avatarImg = document.getElementById('avatar');
                        avatarImg.src = result.avatar_url + '?t=' + Date.now();
                        avatarImg.classList.remove('avatar-default');
                    } else {
                        tg.showPopup({ title: 'Помилка', message: 'Не вдалося завантажити фото', buttons: [{type: 'ok'}] });
                    }
                }
            });
        }

        // Календар
        async function loadLessons() {
            const response = await fetch('/get_lessons', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            lessonsData = await response.json();
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();

            // Заголовки днів тижня
            ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendar.appendChild(header);
            });

            // Попередній і поточний місяць
            for (let monthOffset = -1; monthOffset <= 0; monthOffset++) {
                const date = new Date(currentYear, currentMonth + monthOffset, 1);
                const year = date.getFullYear();
                const month = date.getMonth();

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDay = firstDay === 0 ? 6 : firstDay - 1; // Пн = 0

                // Порожні клітинки перед першим днем
                for (let i = 0; i < startDay; i++) {
                    calendar.appendChild(document.createElement('div'));
                }

                // Дні місяця
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDate = new Date(year, month, day);
                    const dateStr = dayDate.toISOString().split('T')[0];

                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    if (dayDate.toDateString() === today.toDateString()) dayDiv.classList.add('today');

                    const lesson = lessonsData.find(l => l.date === dateStr);
                    if (lesson) {
                        dayDiv.classList.add('has-lesson');
                        const coinsSpan = document.createElement('div');
                        coinsSpan.className = 'day-coins';
                        coinsSpan.textContent = `+${lesson.coins} монет`;
                        dayDiv.appendChild(coinsSpan);
                    }

                    const numberSpan = document.createElement('div');
                    numberSpan.className = 'day-number';
                    numberSpan.textContent = day;
                    dayDiv.prepend(numberSpan);

                    dayDiv.onclick = () => showLessonDetails(dateStr, lesson);
                    calendar.appendChild(dayDiv);
                }
            }
        }

        function showLessonDetails(dateStr, lesson) {
            const details = document.getElementById('lesson-details');
            if (lesson) {
                details.innerHTML = `
                    <p><strong>Дата:</strong> ${new Date(dateStr).toLocaleDateString('uk-UA')}</p>
                    <p><strong>Оцінка:</strong> ${lesson.rating || 'Не оцінено'}</p>
                    <p><strong>Монети отримано:</strong> +${lesson.coins}</p>
                    <p><strong>Коментар:</strong> ${lesson.comment || 'Немає'}</p>
                `;
            } else {
                details.innerHTML = `<p>На ${new Date(dateStr).toLocaleDateString('uk-UA')} уроку не було.</p>`;
            }
        }

        // Магазин
        async function loadShop() {
            const response = await fetch('/get_shop_items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            shopItems = await response.json();
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';

            shopItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'shop-item';

                div.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name}">
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-price">${item.price} монет</div>
                    <button class="buy-btn" ${userData.coins < item.price ? 'disabled' : ''}
                        onclick="buyItem(${item.id})">Купити</button>
                `;
                container.appendChild(div);
            });
        }

        async function buyItem(itemId) {
            const response = await fetch('/buy_item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData, item_id: itemId })
            });
            const result = await response.json();

            if (result.success) {
                userData.coins = result.new_balance;
                document.getElementById('user-coins').textContent = `Монети: ${userData.coins}`;
                document.getElementById('purchase-message').textContent = 'Успішно придбано!';
                renderShop();
                setTimeout(() => document.getElementById('purchase-message').textContent = '', 3000);
            } else {
                document.getElementById('purchase-message').textContent = result.message || 'Помилка покупки';
                document.getElementById('purchase-message').style.color = '#dc3545';
                setTimeout(() => document.getElementById('purchase-message').textContent = '', 3000);
            }
        }

        // Перемикання секцій
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                const sectionId = item.dataset.section + '-section';
                document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
                setTimeout(() => {
                    document.getElementById(sectionId).classList.add('active');
                }, 100);
            });
        });

        // Старт
        loadUserData();
    </script>
</body>
</html>
