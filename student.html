<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            padding: 0;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            width: 160px;
            height: 160px;
        }
        .avatar-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff00cc, #3333ff, #ff00cc);
            padding: 6px;
            animation: pulse-ring 4s linear infinite;
        }
        @keyframes pulse-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .avatar-default-svg {
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .change-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        .change-avatar-btn:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.3);
        }
        .name {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0 8px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .role {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .coins {
            font-size: 24px;
            font-weight: bold;
            background: rgba(255,255,255,0.15);
            padding: 12px 30px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .menu {
            display: flex;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 8px;
            margin-bottom: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .menu-item {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .menu-item.active {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        .content-section {
            display: none;
            background: rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .content-section.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
        .content-section h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Календар */
        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }
        .day-header {
            text-align: center;
            font-weight: bold;
            opacity: 0.8;
            padding: 10px;
        }
        .day {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .day:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .day.has-lesson {
            background: rgba(40,167,69,0.3);
            border: 2px solid #28a745;
        }
        .day.today {
            border: 3px solid #ff512f;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow { from { box-shadow: 0 0 10px #ff512f; } to { box-shadow: 0 0 20px #ff512f; } }
        .day-number { font-size: 20px; font-weight: bold; }
        .day-coins { font-size: 14px; margin-top: 6px; color: #a0ffa0; }

        /* Магазин */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .shop-item {
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.4s;
        }
        .shop-item:hover { transform: translateY(-10px) scale(1.05); }
        .shop-item img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 16px;
        }
        .shop-item-name { font-weight: bold; margin: 10px 0; }
        .shop-item-price { color: #ffeb3b; font-size: 20px; font-weight: bold; }
        .buy-btn {
            margin-top: 15px;
            padding: 12px;
            width: 100%;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .buy-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .buy-btn:hover:not(:disabled) { transform: scale(1.05); }
        #purchase-message {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar-wrapper">
                <div class="avatar-ring">
                    <img id="avatar" class="avatar" src="" alt="Avatar">
                </div>
                <div class="change-avatar-btn" onclick="changeAvatar()">+</div>
            </div>
            <div class="name" id="user-name">Завантаження...</div>
            <div class="role">Учень</div>
            <div class="coins" id="user-coins">Монети: 0</div>
        </div>

        <div class="menu">
            <div class="menu-item active" data-section="calendar">Календар</div>
            <div class="menu-item" data-section="shop">Магазин</div>
            <div class="menu-item" data-section="profile">Профіль</div>
        </div>

        <!-- Календар -->
        <div id="calendar-section" class="content-section active">
            <h2>Календар уроків</h2>
            <div id="calendar"></div>
            <div id="lesson-details" style="margin-top: 40px; text-align: center; font-size: 18px; opacity: 0.9;"></div>
        </div>

        <!-- Магазин -->
        <div id="shop-section" class="content-section">
            <h2>Магазин бонусів</h2>
            <div class="shop-grid" id="shop-items"></div>
            <div id="purchase-message"></div>
        </div>

        <!-- Профіль -->
        <div id="profile-section" class="content-section">
            <h2>Мій профіль</h2>
            <p style="text-align: center; font-size: 18px; opacity: 0.9;">Тут буде статистика, досягнення та інша інформація про твій прогрес.</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const defaultAvatarSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="50" fill="#444"/>
            <circle cx="50" cy="35" r="15" fill="#666"/>
            <path d="M25 70 Q50 90 75 70" stroke="#666" stroke-width="10" fill="none"/>
        </svg>`;

        let userData = {};
        let lessonsData = [];
        let shopItems = [];

        async function loadUserData() {
            const response = await fetch('/get_user_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            userData = await response.json();

            document.getElementById('user-name').textContent = userData.name || 'Учень';
            document.getElementById('user-coins').textContent = `Монети: ${userData.coins || 0}`;

            const avatarImg = document.getElementById('avatar');
            if (userData.avatar_url) {
                avatarImg.src = userData.avatar_url + '?t=' + Date.now();
            } else {
                avatarImg.src = 'data:image/svg+xml;base64,' + btoa(defaultAvatarSVG);
            }

            await loadLessons();
            await loadShop();
            renderCalendar();
            renderShop();
        }

        function changeAvatar() {
            tg.showPopup({
                title: 'Змінити аватарку',
                message: 'Надішліть нове фото профілю',
                buttons: [{ type: 'default', text: 'OK' }]
            });

            tg.requestFile({
                types: ['photo'],
                callback: async (file) => {
                    const response = await fetch('/upload_avatar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initData: tg.initData, file_id: file.file_id })
                    });
                    const result = await response.json();
                    if (result.success) {
                        document.getElementById('avatar').src = result.avatar_url + '?t=' + Date.now();
                    } else {
                        tg.showPopup({ title: 'Помилка', message: 'Не вдалося завантажити фото', buttons: [{type: 'ok'}] });
                    }
                }
            });
        }

        // Календар (повністю як раніше)
        async function loadLessons() {
            const response = await fetch('/get_lessons', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            lessonsData = await response.json();
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();

            ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                calendar.appendChild(header);
            });

            for (let monthOffset = -1; monthOffset <= 0; monthOffset++) {
                const date = new Date(currentYear, currentMonth + monthOffset, 1);
                const year = date.getFullYear();
                const month = date.getMonth();

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const startDay = firstDay === 0 ? 6 : firstDay - 1;

                for (let i = 0; i < startDay; i++) {
                    calendar.appendChild(document.createElement('div'));
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDate = new Date(year, month, day);
                    const dateStr = dayDate.toISOString().split('T')[0];

                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    if (dayDate.toDateString() === today.toDateString()) dayDiv.classList.add('today');

                    const lesson = lessonsData.find(l => l.date === dateStr);
                    if (lesson) {
                        dayDiv.classList.add('has-lesson');
                        const coinsSpan = document.createElement('div');
                        coinsSpan.className = 'day-coins';
                        coinsSpan.textContent = `+${lesson.coins} монет`;
                        dayDiv.appendChild(coinsSpan);
                    }

                    const numberSpan = document.createElement('div');
                    numberSpan.className = 'day-number';
                    numberSpan.textContent = day;
                    dayDiv.prepend(numberSpan);

                    dayDiv.onclick = () => showLessonDetails(dateStr, lesson);
                    calendar.appendChild(dayDiv);
                }
            }
        }

        function showLessonDetails(dateStr, lesson) {
            const details = document.getElementById('lesson-details');
            if (lesson) {
                details.innerHTML = `
                    <p><strong>Дата:</strong> ${new Date(dateStr).toLocaleDateString('uk-UA')}</p>
                    <p><strong>Оцінка:</strong> ${lesson.rating || 'Не оцінено'}</p>
                    <p><strong>Монети отримано:</strong> +${lesson.coins}</p>
                    <p><strong>Коментар:</strong> ${lesson.comment || 'Немає'}</p>
                `;
            } else {
                details.innerHTML = `<p>На ${new Date(dateStr).toLocaleDateString('uk-UA')} уроку не було.</p>`;
            }
        }

        // Магазин (повністю як раніше)
        async function loadShop() {
            const response = await fetch('/get_shop_items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData })
            });
            shopItems = await response.json();
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';

            shopItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'shop-item';

                div.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/90'}" alt="${item.name}">
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-price">${item.price} монет</div>
                    <button class="buy-btn" ${userData.coins < item.price ? 'disabled' : ''}
                        onclick="buyItem(${item.id})">Купити</button>
                `;
                container.appendChild(div);
            });
        }

        async function buyItem(itemId) {
            const response = await fetch('/buy_item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: tg.initData, item_id: itemId })
            });
            const result = await response.json();

            if (result.success) {
                userData.coins = result.new_balance;
                document.getElementById('user-coins').textContent = `Монети: ${userData.coins}`;
                document.getElementById('purchase-message').textContent = 'Успішно придбано!';
                document.getElementById('purchase-message').style.color = '#a0ffa0';
                renderShop();
                setTimeout(() => document.getElementById('purchase-message').textContent = '', 3000);
            } else {
                document.getElementById('purchase-message').textContent = result.message || 'Помилка покупки';
                document.getElementById('purchase-message').style.color = '#ff6b6b';
                setTimeout(() => document.getElementById('purchase-message').textContent = '', 3000);
            }
        }

        // Перемикання секцій
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                const sectionId = item.dataset.section + '-section';
                document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
                setTimeout(() => {
                    document.getElementById(sectionId).classList.add('active');
                }, 100);
            });
        });

        loadUserData();
    </script>
</body>
</html>
