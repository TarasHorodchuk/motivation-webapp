<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій профіль</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1 id="greeting">Завантаження...</h1>
    <p id="class-info"></p>
    <div class="balance" id="total-balance">0 🪙</div>

    <div class="card">
      <h2>Баланс по предметах</h2>
      <div id="subjects-balance">Завантажуємо...</div>
    </div>

    <div class="card">
      <h2>Календар нарахувань</h2>
      <div id="calendar-nav" style="text-align: center; margin-bottom: 10px;">
        <button id="prev-month">←</button>
        <span id="month-title" style="margin: 0 20px; font-weight: bold;"></span>
        <button id="next-month">→</button>
      </div>
      <div id="calendar-container"></div>
    </div>

    <div class="card">
      <h2>Деталі за день</h2>
      <div id="day-details">Обери дату в календарі</div>
    </div>

    <div class="card">
      <h2>Магазин бонусів</h2>
      <button class="btn" onclick="buyBonus(1)">+1 бал до оцінки (10 монет)</button>
      <button class="btn" onclick="buyBonus(2)">+2 бали до оцінки (20 монет)</button>
      <button class="btn" onclick="buyRemoveWarning()">Зняти зауваження (8 монет)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const BOT_API_URL = "https://alease-budless-castiel.ngrok-free.dev";  // ← твій ngrok URL

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    const monthsUa = ["січень", "лютий", "березень", "квітень", "травень", "червень", "липень", "серпень", "вересень", "жовтень", "листопад", "грудень"];

    async function apiRequest(endpoint) {
      try {
        const response = await fetch(`${BOT_API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        return await response.json();
      } catch (err) {
        console.error("API помилка:", err);
        tg.showAlert("Помилка з'єднання з ботом");
        return { error: "Помилка з'єднання" };
      }
    }

    async function loadProfile() {
      const data = await apiRequest('/api/student/profile');

      if (data.error) {
        document.getElementById("calendar-container").innerHTML = `<p style="color:red;">Помилка: ${data.error}</p>`;
        return;
      }

      document.getElementById("greeting").innerText = `Привіт, ${data.first_name} ${data.last_name}!`;
      document.getElementById("class-info").innerText = `Клас: ${data.class_name}`;
      document.getElementById("total-balance").innerText = `${data.total_coins} 🪙`;

      const subjectsDiv = document.getElementById("subjects-balance");
      subjectsDiv.innerHTML = data.subjects.map(s => `
        <p><strong>${s.name}:</strong> ${s.coins} 🪙</p>
      `).join('');

      renderCalendar(data.lesson_dates, data.daily_details);
    }

    function renderCalendar(lessonDates, dailyDetails) {
      const title = document.getElementById("month-title");
      title.textContent = `${monthsUa[currentMonth]} ${currentYear}`;

      const container = document.getElementById("calendar-container");
      container.innerHTML = "";

      const table = document.createElement("table");
      table.style.width = "100%";
      table.style.borderCollapse = "collapse";

      // Заголовок днів тижня
      const header = table.insertRow();
      ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"].forEach(d => {
        const th = document.createElement("th");
        th.textContent = d;
        th.style.padding = "10px";
        th.style.textAlign = "center";
        th.style.background = "rgba(255,255,255,0.1)";
        header.appendChild(th);
      });

      // Перший день місяця
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      let row = table.insertRow();

      // Порожні клітинки
      for (let i = 0; i < adjustedFirstDay; i++) {
        const cell = row.insertCell();
        cell.className = "calendar-day empty";
      }

      // Дні місяця
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = row.insertCell();
        cell.className = "calendar-day";

        const dayDate = new Date(currentYear, currentMonth, day);
        const dayStr = dayDate.toISOString().slice(0, 10);

        if (lessonDates.includes(dayStr)) {
          cell.className += " lesson";
          cell.onclick = () => showDayDetail(dayStr, dailyDetails[dayStr]);
        } else {
          cell.className += " other";
        }

        cell.textContent = day;

        if ((adjustedFirstDay + day) % 7 === 0 && day < daysInMonth) {
          row = table.insertRow();
        }
      }

      container.appendChild(table);
    }

    function showDayDetail(dayStr, details) {
      if (!details || details.total === 0) {
        document.getElementById("day-details").innerHTML = "За цю дату немає нарахувань.";
        return;
      }

      const monthsUa = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
      const dayObj = new Date(dayStr);
      const dayFormatted = `${dayObj.getDate()} ${monthsUa[dayObj.getMonth()]} ${dayObj.getFullYear()}`;
      const dayOfWeek = ["понеділок", "вівторок", "середа", "четвер", "п'ятниця", "субота", "неділя"][dayObj.getDay()];

      let text = `<strong>${dayFormatted} (${dayOfWeek})</strong><br><br>`;
      text += `Сумарно: ${details.total} 🪙<br><br>`;
      for (let crit of details.criteria) {
        text += `✓ ${crit.criterion} (+${crit.coins} монет)<br>`;
      }

      document.getElementById("day-details").innerHTML = text;
    }

    // Стрілки перелистування
    document.getElementById("prev-month").onclick = () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      loadProfile();  // перезагружаємо з новим місяцем
    };

    document.getElementById("next-month").onclick = () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      loadProfile();
    };

    tg.MainButton.setText("Оновити").show();
    tg.MainButton.onClick(loadProfile);

    loadProfile();
  </script>
</body>
</html>
